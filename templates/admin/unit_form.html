{% extends "admin/base.html" %}
{% block title %}Edit Unit — {{ unit.compound.name }} — Meleven Admin{% endblock %}
{% block content %}
<div class="admin-container narrow-admin">
    <div class="admin-page-header">
        <h1>Edit Unit — {{ unit.compound.name }}</h1>
        <a href="{{ url_for('admin_units', compound_id=unit.compound_id) }}" class="admin-cancel-link">← Back to Units</a>
    </div>

    <form method="post" class="admin-form" enctype="multipart/form-data">
        <label>Unit Type *</label>
        <input type="text" name="unit_type" value="{{ unit.unit_type }}" required>

        <label>Phase / Neighborhood (optional)</label>
        <input type="text" name="phase" value="{{ unit.phase or '' }}" placeholder="e.g. Shore Residence, Town Island, Lagoon Town">

        <div class="admin-form-row">
            <div>
                <label>Bedrooms</label>
                <input type="number" name="bedrooms" value="{{ unit.bedrooms if unit.bedrooms is not none else '' }}">
            </div>
            <div>
                <label>Bathrooms</label>
                <input type="number" name="bathrooms" value="{{ unit.bathrooms if unit.bathrooms is not none else '' }}">
            </div>
        </div>

        <div class="admin-form-row">
            <div>
                <label>Area (sqm)</label>
                <input type="number" step="0.01" name="area_sqm" value="{{ unit.area_sqm if unit.area_sqm is not none else '' }}">
            </div>
            <div>
                <label>Price</label>
                <input type="number" step="0.01" name="price" value="{{ unit.price if unit.price is not none else '' }}">
            </div>
            <div>
                <label>Currency</label>
                <select name="currency">
                    <option value="EGP" {% if not unit.currency or unit.currency == 'EGP' %}selected{% endif %}>EGP</option>
                    <option value="USD" {% if unit.currency == 'USD' %}selected{% endif %}>USD</option>
                </select>
            </div>
        </div>

        <div class="admin-form-row">
            <div>
                <label>Delivery Year</label>
                <input type="number" name="delivery_year" value="{{ unit.delivery_year if unit.delivery_year is not none else '' }}">
            </div>
            <div>
                <label>Payment Plan</label>
                <input type="text" name="payment_plan" value="{{ unit.payment_plan or '' }}">
            </div>
        </div>

        <label>Unit Photo</label>
        {% if unit.image_url %}
        <p class="unit-payment-plan">Current photo: <a href="{{ unit.image_url }}" target="_blank">view</a></p>
        {% endif %}
        <input type="file" name="image_file" accept="image/*">
        <label>Or Unit Image URL (used only if you don't upload a photo above — falls back to the compound's cover image if both are empty)</label>
        <input type="text" name="image_url" value="{{ unit.image_url or '' }}" placeholder="https://...">

        <label class="checkbox-label">
            <input type="checkbox" name="is_available" {% if unit.is_available %}checked{% endif %}>
            Available
        </label>
        <label class="checkbox-label">
            <input type="checkbox" name="is_launch" {% if unit.is_launch %}checked{% endif %}>
            Launch (shows a "Launch" badge and drives the homepage "New Launches" section)
        </label>

        <div class="admin-form-actions">
            <button type="submit" class="btn-primary">Save Changes</button>
            <a href="{{ url_for('admin_units', compound_id=unit.compound_id) }}" class="admin-cancel-link">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
